

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - MAX_FILE_SIZE_MB=25
      - CONVERSION_TIMEOUT_SECONDS=60
    volumes:
      - conversion-temp:/tmp/ilovepdf-clone

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  conversion-temp:
